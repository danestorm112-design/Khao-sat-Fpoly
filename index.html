<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tiêu đề trên tab trình duyệt -->
    <title>Khảo sát Sức khoẻ Tinh thần Sinh viên FPT Polytechnic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Màu cam FPT Polytechnic */
        :root {
            --fpt-orange: #F7931E;
            --fpt-dark: #333;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .fpt-bg {
            background-color: var(--fpt-orange);
        }

        .fpt-text {
            color: var(--fpt-orange);
        }

        .fpt-border {
            border-color: var(--fpt-orange);
        }

        .fpt-button {
            background-color: var(--fpt-orange);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.1);
        }

        .fpt-button:hover {
            background-color: #e6861c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.15);
        }

        .fpt-button:disabled {
            background-color: #fcd9b0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Tùy chỉnh radio button mới (kiểu dọc) */
        .radio-option {
            display: block;
            position: relative;
            padding: 1rem 1rem 1rem 3rem; /* Tăng padding để có không gian */
            margin-bottom: 0.75rem; /* 12px */
            border: 2px solid #ddd;
            border-radius: 0.75rem; /* 12px */
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .radio-option:hover {
            border-color: #c4c4c4;
            background-color: #fafafa;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .radio-checkmark {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            height: 1.5rem; /* 24px */
            width: 1.5rem; /* 24px */
            background-color: #eee;
            border: 2px solid #ddd;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .radio-option input:checked ~ .radio-checkmark {
            background-color: var(--fpt-orange);
            border-color: var(--fpt-orange);
        }

        .radio-option input:checked ~ .radio-checkmark:after {
            content: '';
            display: block;
            width: 0.75rem; /* 12px */
            height: 0.75rem; /* 12px */
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .radio-option input:checked ~ .radio-text-container {
            font-weight: 600;
            color: var(--fpt-dark);
        }
        
        .radio-option:hover input:not(:checked) ~ .radio-checkmark {
             background-color: #e0e0e0;
        }

        .radio-text-container {
            color: #333;
        }

        .radio-text {
            font-size: 1rem; /* 16px */
            line-height: 1.5;
        }

        /* Spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--fpt-orange);
            animation: spin 1s ease infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 md:p-8">
    <div class="bg-white w-full max-w-3xl p-6 md:p-10 rounded-2xl shadow-xl border border-gray-200">

        <!-- Tiêu đề chính của Form -->
        <div class="flex flex-col items-center justify-center mb-8 text-center">
            <!-- <img src="logo-url-neu-co.png" alt="Logo" class="w-48 mb-4"> -->
            <h1 class="text-3xl font-bold text-gray-800">Khảo sát Sức khoẻ Tinh thần Sinh viên FPT Polytechnic</h1>
            <p class="text-xl text-gray-600 mt-2">Bộ câu hỏi DASS-21</p>
        </div>

        <form id="dass-form" novalidate>
            
            <!-- Thông tin cá nhân -->
            <fieldset class="mb-8 p-6 bg-gray-50 border border-gray-200 rounded-lg">
                <legend class="text-xl font-semibold text-gray-700 px-2">Thông tin cá nhân</legend>
                <div class="space-y-4 mt-4">
                    <div>
                        <label for="hoTen" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên <span class="text-red-500">*</span></label>
                        <input type="text" id="hoTen" name="hoTen" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-fpt-orange" required>
                    </div>
                    <div>
                        <label for="maSv" class="block text-sm font-medium text-gray-700 mb-1">Mã số sinh viên <span class="text-red-500">*</span></label>
                        <input type="text" id="maSv" name="maSv" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-fpt-orange" required>
                    </div>
                    <div>
                        <label for="sdt" class="block text-sm font-medium text-gray-700 mb-1">SĐT liên hệ <span class="text-red-500">*</span></label>
                        <input type="tel" id="sdt" name="sdt" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-fpt-orange" required>
                    </div>
                </div>
            </fieldset>

            <!-- Hướng dẫn (Đã bỏ đi vì đã tích hợp vào câu trả lời) -->
            <!-- <div class="mb-8 p-6 bg-blue-50 border border-blue-200 rounded-lg text-blue-800"> ... </div> -->

            <!-- Khối chứa các câu hỏi -->
            <div class="space-y-8" id="questions-container">
                <!-- Các câu hỏi sẽ được Javascript chèn vào đây -->
            </div>

            <!-- Nút Submit -->
            <div class="mt-10 text-center">
                <button type="submit" id="submit-button" class="fpt-button font-bold py-4 px-10 rounded-lg text-lg w-full md:w-auto">
                    Hoàn thành & Xem Kết Quả
                </button>
            </div>
        </form>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="mt-6 text-center hidden">
            <div class="spinner mx-auto"></div>
            <p class="text-gray-600 mt-2">Đang xử lý kết quả...</p>
        </div>

        <!-- Hộp thông báo (Lỗi/Thành công) -->
        <div id="message-box" class="mt-6 p-4 rounded-lg text-center hidden"></div>

        <!-- Khu vực hiển thị kết quả -->
        <div id="results" class="mt-10 hidden border-t pt-8">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Kết Quả Khảo Sát</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div id="result-stress" class="p-6 rounded-lg text-center shadow-md border"></div>
                <div id="result-anxiety" class="p-6 rounded-lg text-center shadow-md border"></div>
                <div id="result-depression" class="p-6 rounded-lg text-center shadow-md border"></div>
            </div>
            <p class="text-center text-sm text-gray-600 mt-6">
                <strong>Lưu ý:</strong> Kết quả này chỉ mang tính chất tham khảo. Vui lòng tìm đến chuyên gia tâm lý hoặc bác sĩ để có được chẩn đoán chính xác.
            </p>
        </div>
    </div>

    <script>
        // URL Google Apps Script của bạn
        // !!! THAY THẾ URL NÀY BẰNG URL BẠN ĐÃ TRIỂN KHAI (DEPLOY)
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-VjgujJ0cCsv3C90gTmLzE3xknyZPuFH-wUEg6HtMuEnFpwZ2_3jQaqjiDKlR3Hxm8g/exec';

        const questions = [
            { id: 'q1', text: 'Tôi thấy khó mà thoải mái được' },
            { id: 'q2', text: 'Tôi bị khô miệng' },
            { id: 'q3', text: 'Tôi dường như chẳng có chút cảm xúc tích cực nào' },
            { id: 'q4', text: 'Tôi bị rối loạn nhịp thở (thở gấp, khó thở dù chẳng làm việc gì nặng)' },
            { id: 'q5', text: 'Tôi thấy khó bắt tay vào công việc' },
            { id: 'q6', text: 'Tôi có xu hướng phản ứng thái quá với mọi tình huống' },
            { id: 'q7', text: 'Tôi bị ra mồ hôi (chẳng hạn như mồ hôi tay...)' },
            { id: 'q8', text: 'Tôi thấy mình đang suy nghĩ quá nhiều' },
            { id: 'q9', text: 'Tôi lo lắng về những tình huống có thể làm tôi hoảng sợ hoặc biến tôi thành trò cười' },
            { id: 'q10', text: 'Tôi thấy mình chẳng có gì để mong đợi cả' },
            { id: 'q11', text: 'Tôi thấy bản thân dễ bị kích động' },
            { id: 'q12', text: 'Tôi thấy khó thư giãn được' },
            { id: 'q13', text: 'Tôi cảm thấy chán nản, thất vọng' },
            { id: 'q14', text: 'Tôi không chấp nhận được việc có cái gì đó xen vào cản trở việc tôi đang làm' },
            { id: 'q15', text: 'Tôi thấy mình gần như hoảng loạn' },
            { id: 'q16', text: 'Tôi không thấy hăng hái với bất kỳ việc gì nữa' },
            { id: 'q17', text: 'Tôi cảm thấy mình chẳng đáng làm người' },
            { id: 'q18', text: 'Tôi thấy mình khá dễ phật ý, tự ái' },
            { id: 'q19', text: 'Tôi nghe thấy rõ tiếng nhịp tim dù chẳng làm việc gì cả (ví dụ, tiếng nhịp tim tăng, tiếng tim loạn nhịp)' },
            { id: 'q20', text: 'Tôi hay sợ vô cớ' },
            { id: 'q21', text: 'Tôi thấy cuộc sống vô nghĩa' }
        ];

        // Mô tả chi tiết cho các lựa chọn
        const optionsText = [
            "Không đúng với tôi chút nào cả",
            "Đúng với tôi phần nào, hoặc thỉnh thoảng mới đúng",
            "Đúng với tôi phần nhiều, hoặc phần lớn thời gian là đúng",
            "Hoàn toàn đúng với tôi, hoặc hầu hết thời gian là đúng"
        ];

        // Định nghĩa các câu hỏi cho mỗi thang đo
        const scales = {
            depression: ['q3', 'q5', 'q10', 'q13', 'q16', 'q17', 'q21'],
            anxiety: ['q2', 'q4', 'q7', 'q9', 'q15', 'q19', 'q20'],
            stress: ['q1', 'q6', 'q8', 'q11', 'q12', 'q14', 'q18']
        };

        // Các màu sắc cho mức độ
        const colors = {
            normal: { text: 'text-green-800', bg: 'bg-green-100', border: 'border-green-300' },
            mild: { text: 'text-blue-800', bg: 'bg-blue-100', border: 'border-blue-300' },
            moderate: { text: 'text-yellow-800', bg: 'bg-yellow-100', border: 'border-yellow-300' },
            severe: { text: 'text-orange-800', bg: 'bg-orange-100', border: 'border-orange-300' },
            extremelySevere: { text: 'text-red-800', bg: 'bg-red-100', border: 'border-red-300' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('questions-container');
            // Tạo các câu hỏi
            questions.forEach((q, index) => {
                const questionElement = document.createElement('div');
                questionElement.className = 'p-6 border border-gray-200 rounded-lg bg-white shadow-sm';
                
                // Tạo các tùy chọn trả lời (mới, theo chiều dọc)
                const optionsHtml = [0, 1, 2, 3].map(val => `
                    <label class="radio-option" role="radio" aria-checked="false" tabindex="0">
                        <input type="radio" name="${q.id}" value="${val}" required>
                        <span class="radio-checkmark"></span>
                        <span class="radio-text-container">
                            <span class="radio-text"><b>${val}</b> = ${optionsText[val]}</span>
                        </span>
                    </label>
                `).join('');

                questionElement.innerHTML = `
                    <p class="text-lg font-medium text-gray-800 mb-5" id="label-${q.id}">${index + 1}. ${q.text}</p>
                    <div role="radiogroup" aria-labelledby="label-${q.id}">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(questionElement);
            });

            // Thêm sự kiện cho các radio button tùy chỉnh
            container.querySelectorAll('.radio-option').forEach(label => {
                label.addEventListener('click', () => {
                    // Reset aria-checked
                    const groupName = label.querySelector('input').name;
                    document.querySelectorAll(`input[name="${groupName}"]`).forEach(rb => {
                        rb.closest('.radio-option').setAttribute('aria-checked', 'false');
                    });
                    // Set aria-checked
                    label.setAttribute('aria-checked', 'true');
                });
                // Hỗ trợ nhấn Enter/Space
                label.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        label.querySelector('input').checked = true;
                        label.click(); // Kích hoạt sự kiện click để cập nhật aria
                    }
                });
            });

            // Gắn sự kiện submit cho form
            document.getElementById('dass-form').addEventListener('submit', handleSubmit);
        });

        function handleSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const answers = {};
            let allAnswered = true;
            let firstUnanswered = null;

            // Kiểm tra thông tin cá nhân
            const hoTen = formData.get('hoTen').trim();
            const maSv = formData.get('maSv').trim();
            const sdt = formData.get('sdt').trim();

            if (!hoTen || !maSv || !sdt) {
                showMessage('Vui lòng điền đầy đủ thông tin cá nhân (Họ tên, Mã SV, SĐT).', 'error');
                document.querySelector('fieldset').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            // Kiểm tra các câu hỏi DASS-21
            for (const q of questions) {
                const answer = formData.get(q.id);
                if (answer === null) {
                    allAnswered = false;
                    if (!firstUnanswered) {
                        firstUnanswered = q.id;
                    }
                } else {
                    answers[q.id] = parseInt(answer, 10);
                }
            }

            if (!allAnswered) {
                showMessage('Vui lòng trả lời tất cả 21 câu hỏi.', 'error');
                document.getElementsByName(firstUnanswered)[0]?.closest('.p-6').scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            // Ẩn form, hiển thị loading
            setLoading(true);
            showMessage('', 'success', true); // Ẩn thông báo
            document.getElementById('results').classList.add('hidden');


            // 1. Tính toán điểm
            const scores = { depression: 0, anxiety: 0, stress: 0 };
            scales.depression.forEach(qId => scores.depression += answers[qId]);
            scales.anxiety.forEach(qId => scores.anxiety += answers[qId]);
            scales.stress.forEach(qId => scores.stress += answers[qId]);

            // 2. Lấy mức độ (Sử dụng điểm GỐC, không nhân 2, theo bảng của bạn)
            const depressionResult = getSeverity('depression', scores.depression);
            const anxietyResult = getSeverity('anxiety', scores.anxiety);
            const stressResult = getSeverity('stress', scores.stress);

            // 3. Chuẩn bị dữ liệu để gửi đi
            const dataToSubmit = new FormData();
            dataToSubmit.append('timestamp', new Date().toISOString());
            dataToSubmit.append('hoTen', hoTen);
            dataToSubmit.append('maSv', maSv);
            dataToSubmit.append('sdt', sdt);

            dataToSubmit.append('depressionScore', scores.depression);
            dataToSubmit.append('depressionSeverity', depressionResult.text);
            dataToSubmit.append('anxietyScore', scores.anxiety);
            dataToSubmit.append('anxietySeverity', anxietyResult.text);
            dataToSubmit.append('stressScore', scores.stress);
            dataToSubmit.append('stressSeverity', stressResult.text);

            // Thêm các câu trả lời thô q1...q21
            questions.forEach(q => {
                dataToSubmit.append(q.id, answers[q.id]);
            });

            // 4. Gửi dữ liệu đến Google Apps Script
            if (APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                console.warn('APPS_SCRIPT_URL chưa được cấu hình. Bỏ qua bước gửi dữ liệu.');
                // Vẫn hiển thị kết quả cho sinh viên
                setLoading(false);
                displayResults(scores, depressionResult, anxietyResult, stressResult);
                showMessage('Đã hoàn thành! (Chưa cấu hình lưu trữ)', 'success');
                return;
            }

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: dataToSubmit,
            })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        showMessage('Đã nộp bài thành công!', 'success');
                    } else {
                        throw new Error(data.message || 'Lỗi không xác định');
                    }
                })
                .catch(error => {
                    console.error('Lỗi khi gửi dữ liệu:', error);
                    showMessage(`Lỗi: Không thể gửi kết quả. (${error.message})`, 'error');
                })
                .finally(() => {
                    setLoading(false);
                    // Luôn hiển thị kết quả cho sinh viên dù lưu thành công hay không
                    displayResults(scores, depressionResult, anxietyResult, stressResult);
                });
        }

        function getSeverity(type, score) {
            let text = '';
            let colorSet;

            if (type === 'depression') {
                // Thang điểm Trầm cảm (0-4, 5-6, 7-10, 11-13, >=14)
                if (score <= 4) { text = 'Bình thường'; colorSet = colors.normal; }
                else if (score <= 6) { text = 'Nhẹ'; colorSet = colors.mild; }
                else if (score <= 10) { text = 'Vừa'; colorSet = colors.moderate; }
                else if (score <= 13) { text = 'Nặng'; colorSet = colors.severe; }
                else { text = 'Rất nặng'; colorSet = colors.extremelySevere; }
            } else if (type === 'anxiety') {
                // Thang điểm Lo âu (0-3, 4-5, 6-7, 8-9, >=10)
                if (score <= 3) { text = 'Bình thường'; colorSet = colors.normal; }
                else if (score <= 5) { text = 'Nhẹ'; colorSet = colors.mild; }
                else if (score <= 7) { text = 'Vừa'; colorSet = colors.moderate; }
                else if (score <= 9) { text = 'Nặng'; colorSet = colors.severe; }
                else { text = 'Rất nặng'; colorSet = colors.extremelySevere; }
            } else if (type === 'stress') {
                // Thang điểm Stress (0-7, 8-9, 10-12, 13-16, >=17)
                if (score <= 7) { text = 'Bình thường'; colorSet = colors.normal; }
                else if (score <= 9) { text = 'Nhẹ'; colorSet = colors.mild; }
                else if (score <= 12) { text = 'Vừa'; colorSet = colors.moderate; }
                else if (score <= 16) { text = 'Nặng'; colorSet = colors.severe; }
                else { text = 'Rất nặng'; colorSet = colors.extremelySevere; }
            }

            return {
                text: text,
                colors: colorSet
            };
        }

        function displayResults(scores, depression, anxiety, stress) {
            const resultsContainer = document.getElementById('results');

            const stressEl = document.getElementById('result-stress');
            const anxietyEl = document.getElementById('result-anxiety');
            const depressionEl = document.getElementById('result-depression');

            // Xóa các class màu cũ
            [stressEl, anxietyEl, depressionEl].forEach(el => {
                Object.values(colors).forEach(c => {
                    el.classList.remove(c.text, c.bg, c.border);
                });
            });

            // Cập nhật Stress
            stressEl.innerHTML = `
                <h3 class="text-xl font-semibold mb-2 ${stress.colors.text}">Căng thẳng (Stress)</h3>
                <p class="text-3xl font-bold ${stress.colors.text}">${scores.stress}</p>
                <p class="text-lg font-medium mt-1 ${stress.colors.text}">${stress.text}</p>
            `;
            stressEl.classList.add(stress.colors.bg, stress.colors.border, stress.colors.text);

            // Cập nhật Lo âu
            anxietyEl.innerHTML = `
                <h3 class="text-xl font-semibold mb-2 ${anxiety.colors.text}">Lo âu (Anxiety)</h3>
                <p class="text-3xl font-bold ${anxiety.colors.text}">${scores.anxiety}</p>
                <p class="text-lg font-medium mt-1 ${anxiety.colors.text}">${anxiety.text}</p>
            `;
            anxietyEl.classList.add(anxiety.colors.bg, anxiety.colors.border, anxiety.colors.text);

            // Cập nhật Trầm cảm
            depressionEl.innerHTML = `
                <h3 class="text-xl font-semibold mb-2 ${depression.colors.text}">Trầm cảm (Depression)</h3>
                <p class="text-3xl font-bold ${depression.colors.text}">${scores.depression}</p>
                <p class="text-lg font-medium mt-1 ${depression.colors.text}">${depression.text}</p>
            `;
            depressionEl.classList.add(depression.colors.bg, depression.colors.border, depression.colors.text);

            resultsContainer.classList.remove('hidden');
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function showMessage(message, type = 'success', hide = false) {
            const box = document.getElementById('message-box');
            if (hide) {
                box.classList.add('hidden');
                return;
            }
            box.textContent = message;
            box.className = 'mt-6 p-4 rounded-lg text-center'; // Reset classes
            if (type === 'success') {
                box.classList.add('bg-green-100', 'text-green-800');
            } else {
                box.classList.add('bg-red-100', 'text-red-800');
            }
            box.classList.remove('hidden');
            box.scrollIntoView({ behavior: 'smooth' });
        }

        function setLoading(isLoading) {
            const button = document.getElementById('submit-button');
            const spinner = document.getElementById('loading-spinner');
            const form = document.getElementById('dass-form');

            if (isLoading) {
                button.disabled = true;
                button.classList.add('opacity-50');
                spinner.classList.remove('hidden');
                form.classList.add('hidden'); // Ẩn form khi nộp
            } else {
                button.disabled = false;
                button.classList.remove('opacity-50');
                spinner.classList.add('hidden');
                form.classList.remove('hidden'); // Hiện lại form (để phòng khi có lỗi)
            }
        }
    </script>
</body>
</html>
